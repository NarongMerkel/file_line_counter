[project]
name = "file-line-counter"
version = "0.1.0"
description = "Counts lines in a file without loading it entirely into memory, optionally skipping blank or comment lines."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
